[package]
name = "heroinn_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
heroinn_util.workspace = true
simplelog.workspace = true
log.workspace = true
uuid.workspace = true
systemstat.workspace = true
os_info.workspace = true
whoami.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
conpty = { git = "https://github.com/b23r0/conpty.git" }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
nix = { workspace = true, features = ["term", "process"] }
libc.workspace = true
