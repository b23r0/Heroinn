[workspace]
resolver = "3"
members = [
    "heroinn",
    "heroinn_client",
    "heroinn_core",
    "heroinn_util",
    "th3rd/heroinn_ftp",
    # Vendored terminal implementation that backs interactive shell sessions.
    "th3rd/heroinn_shell",
    "th3rd/heroinn_shell/protocol",
    "th3rd/heroinn_shell/alacritty_terminal",
    "th3rd/heroinn_shell/alacritty_config_derive",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["b23r0"]

[workspace.dependencies]
# Internal crates
heroinn_util = { path = "heroinn_util" }
heroinn_core = { path = "heroinn_core" }
heroinn_shell_protocol = { path = "th3rd/heroinn_shell/protocol" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
simplelog = "0.12"
simple_logger = "5.2"

# Time / IDs
chrono = "0.4"
uuid = { version = "1.26", features = ["v4"] }

# Networking / async
tokio = "1.53"
socket2 = "0.6"
websocket = "0.27"
rust-raknet = "1.0"
url = "2.5"
native-tls = "0.2"

# Filesystem / system information
sysinfo = "0.39"
path-absolutize = "4.0"
md-5 = "0.11"
systemstat = "0.2"
os_info = "3.15"
whoami = "2.1"

# Errors
thiserror = "2"

# GUI
eframe = "0.36"
egui_extras = "0.36"
image = { version = "0.25", features = ["jpeg", "png", "ico"] }
rfd = "0.17"
# epaint 0.36 calls profiling macros but depends on profiling without enabling
# its default `procmacros` feature. GUI crates depend on this directly so Cargo
# feature unification keeps the published epaint release buildable.
profiling = { version = "1.0", features = ["procmacros"] }

# Platform
libc = "0.2"
nix = "0.31"

# Windows-only (kept at legacy versions for now)
windows = "0.39"
winreg = "0.10"

[profile.release.package.heroinn_client]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
codegen-units = 1

# RUSTFLAGS='-C target-feature=+crt-static' proxychains4  cargo build --package heroinn_client --release --target x86_64-unknown-linux-gnu
